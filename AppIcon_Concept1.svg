<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background: deep black with subtle dark gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Subtle center glow -->
  <ellipse cx="512" cy="480" rx="320" ry="280" fill="url(#glow)"/>

  <!-- Aperture / iris — 6 blades, elegant thin strokes -->
  <g transform="translate(512, 480)">
    <!-- Blade 1 -->
    <path d="M 0,-180 C 40,-160 60,-80 0,0 C -60,-80 -40,-160 0,-180 Z"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.55"
          transform="rotate(0)"/>
    <!-- Blade 2 -->
    <path d="M 0,-180 C 40,-160 60,-80 0,0 C -60,-80 -40,-160 0,-180 Z"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.55"
          transform="rotate(60)"/>
    <!-- Blade 3 -->
    <path d="M 0,-180 C 40,-160 60,-80 0,0 C -60,-80 -40,-160 0,-180 Z"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.55"
          transform="rotate(120)"/>
    <!-- Blade 4 -->
    <path d="M 0,-180 C 40,-160 60,-80 0,0 C -60,-80 -40,-160 0,-180 Z"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.55"
          transform="rotate(180)"/>
    <!-- Blade 5 -->
    <path d="M 0,-180 C 40,-160 60,-80 0,0 C -60,-80 -40,-160 0,-180 Z"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.55"
          transform="rotate(240)"/>
    <!-- Blade 6 -->
    <path d="M 0,-180 C 40,-160 60,-80 0,0 C -60,-80 -40,-160 0,-180 Z"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.55"
          transform="rotate(300)"/>

    <!-- Outer ring -->
    <circle r="182" fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <!-- Inner ring -->
    <circle r="58" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <!-- Center dot -->
    <circle r="8" fill="white" opacity="0.9"/>
  </g>

  <!-- Single sparkle top-right of aperture -->
  <g transform="translate(640, 320)" opacity="0.8">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="white" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="white" stroke-width="1.5"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="white" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="710"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="88"
        font-weight="400"
        fill="white"
        text-anchor="middle"
        letter-spacing="18"
        opacity="0.95">VESPER</text>
</svg>
